name: Deploy to Staging

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: us-east-1

  STATIC_BUCKET: lc3-navigator-static-staging
  CONFIG_BUCKET: lc3-navigator-config-staging

  SEARCH_FUNCTION: lc3-search-staging
  PATHFINDING_FUNCTION: lc3-pathfinding-staging
  DIRECTION_FUNCTION: lc3-direction-staging

  DDB_TABLE: LC3_CourseMapping_staging
  GRAPH_S3_KEY: graph/graph.json

jobs:
  deploy-config:
    name: Deploy Config to S3 and DynamoDB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate config JSON files
        run: |
          python -m json.tool Database/graph.json > /dev/null
          python -m json.tool Database/search_metadata.json > /dev/null
          echo "JSON validation passed."

      - name: Upload graph config to Config S3 bucket
        run: |
          aws s3 cp Database/graph.json s3://${CONFIG_BUCKET}/graph/graph.json \
            --content-type application/json

      - name: Upload search metadata to Config S3 bucket
        run: |
          aws s3 cp Database/search_metadata.json s3://${CONFIG_BUCKET}/config/search_metadata.json \
            --content-type application/json

      - name: Upload floor plan resources to Config S3 bucket
        run: |
          if [ -d "Frontend/resources" ]; then
            aws s3 sync Frontend/resources/ s3://${CONFIG_BUCKET}/floor-plans/ \
              --delete \
              --exclude "*.DS_Store"
          else
            echo "Frontend/resources not found, skipping floor plan upload."
          fi

      - name: Install Python dependencies for DynamoDB seeding
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Seed DynamoDB from latest config
        run: |
          DDB_TABLE=${DDB_TABLE} python Database/seed_data.py

  deploy-frontend:
    name: Deploy Frontend to Static S3
    runs-on: ubuntu-latest
    needs: deploy-config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Frontend to Static S3 bucket
        run: |
          aws s3 sync Frontend/ s3://${STATIC_BUCKET} \
            --delete \
            --exclude "*.DS_Store"

  deploy-lambdas:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    needs: deploy-config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy search Lambda code
        run: |
          cd Backend/lambdas/search
          zip -r /tmp/lc3-search.zip lambda_function.py
          aws lambda update-function-code \
            --function-name ${SEARCH_FUNCTION} \
            --zip-file fileb:///tmp/lc3-search.zip
          aws lambda wait function-updated \
            --function-name ${SEARCH_FUNCTION}

      - name: Configure search Lambda environment
        run: |
          aws lambda update-function-configuration \
            --function-name ${SEARCH_FUNCTION} \
            --environment "Variables={DDB_TABLE=${DDB_TABLE},CONFIG_VERSION=${GITHUB_SHA}}"
          aws lambda wait function-updated \
            --function-name ${SEARCH_FUNCTION}

      - name: Deploy pathfinding Lambda code
        run: |
          cd Backend/lambdas/pathfinding
          zip -r /tmp/lc3-pathfinding.zip lambda_function.py
          aws lambda update-function-code \
            --function-name ${PATHFINDING_FUNCTION} \
            --zip-file fileb:///tmp/lc3-pathfinding.zip
          aws lambda wait function-updated \
            --function-name ${PATHFINDING_FUNCTION}

      - name: Configure pathfinding Lambda environment
        run: |
          aws lambda update-function-configuration \
            --function-name ${PATHFINDING_FUNCTION} \
            --environment "Variables={GRAPH_S3_BUCKET=${CONFIG_BUCKET},GRAPH_S3_KEY=${GRAPH_S3_KEY},CONFIG_VERSION=${GITHUB_SHA}}"
          aws lambda wait function-updated \
            --function-name ${PATHFINDING_FUNCTION}

      - name: Deploy direction Lambda code
        run: |
          cd Backend/lambdas/direction
          zip -r /tmp/lc3-direction.zip lambda_function.py
          aws lambda update-function-code \
            --function-name ${DIRECTION_FUNCTION} \
            --zip-file fileb:///tmp/lc3-direction.zip
          aws lambda wait function-updated \
            --function-name ${DIRECTION_FUNCTION}

      - name: Configure direction Lambda environment
        run: |
          aws lambda update-function-configuration \
            --function-name ${DIRECTION_FUNCTION} \
            --environment "Variables={GRAPH_S3_BUCKET=${CONFIG_BUCKET},GRAPH_S3_KEY=${GRAPH_S3_KEY},CONFIG_VERSION=${GITHUB_SHA}}"
          aws lambda wait function-updated \
            --function-name ${DIRECTION_FUNCTION}